name: 🚀 Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: 🚛 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 👷‍♂️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_FATHOM_SITE_ID=${{ secrets.FATHOM_SITE_ID }}
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: dpointeck.dev
  deploy:
    name: 🐳 Deploy
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: GHCR_TOKEN
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || exit 1
            docker stop ${{ env.CONTAINER_NAME }}
            docker rm ${{ env.CONTAINER_NAME }}
            docker run -d --restart=always --name ${{ env.CONTAINER_NAME }} -p 127.0.0.1:8002:3000 -e NEXT_PUBLIC_FATHOM_SITE_ID=${{ secrets.FATHOM_SITE_ID }} ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: dpointeck.dev
          CONTAINER_NAME: dp-next
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
